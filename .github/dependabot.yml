version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "01:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /.github/integration
    schedule:
      interval: weekly
      day: wednesday
      time: "01:20"
      timezone: Etc/UTC
